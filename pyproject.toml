[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtutrial-core"
version = "0.1.0"
description = "Synthetic control arms and digital-twin forecasts for clinical-trial research"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Subramani Nagaraj" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
workbench = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]
hosted = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/snagaraj07/virtutrial-core"
Repository = "https://github.com/snagaraj07/virtutrial-core"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "simulator",
  "forecaster",
  "vca_engine",
  "schema",
  "privacy",
  "diagnostics",
  "runner",
  "workbench",
  "auth",
  "audit",
  "studies",
]
