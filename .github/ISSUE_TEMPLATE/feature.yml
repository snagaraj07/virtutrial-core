name: Change request
description: A library change, a new estimator, or a documentation fix
title: "Change: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a researcher cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Which module it touches (simulator, forecaster, vca_engine) and how the result should change.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This request contains no study tables, patient-level output, credentials, or secrets.
          required: true
